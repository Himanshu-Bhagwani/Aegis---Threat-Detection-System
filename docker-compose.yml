# ─────────────────────────────────────────────────────────────
# Apeilo Threat Detection — full stack
#   - backend  : FastAPI on :8000  (uvicorn src.api.fastapi_app:app --reload)
#   - frontend : Next.js on  :3000 (npm run dev)
#   - ollama   : llama3.2 LLM on :11434 (chatbot backend)
#
# Run from repo root:
#   docker compose up --build
#
# Open: http://localhost:3000
# ─────────────────────────────────────────────────────────────

services:
  ollama:
    image: ollama/ollama:latest
    container_name: apeilo-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    # Start the server, then pull llama3.2 once it's up. Pull is a no-op
    # on subsequent runs because weights live in the ollama_models volume.
    entrypoint: >
      /bin/sh -c "
      /bin/ollama serve &
      pid=$$!;
      until curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 1; done;
      if ! /bin/ollama list | grep -q 'llama3.2'; then
        echo 'Pulling llama3.2 ...';
        /bin/ollama pull llama3.2;
      fi;
      echo 'Ollama ready';
      wait $$pid
      "
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q llama3.2"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: apeilo-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DYNAMODB_EVENTS_TABLE: ${DYNAMODB_EVENTS_TABLE:-Apeilo-events}
      DYNAMODB_PROFILES_TABLE: ${DYNAMODB_PROFILES_TABLE:-apeilo-users-profile}
      DYNAMODB_ALERTS_TABLE: ${DYNAMODB_ALERTS_TABLE:-Apeilo-alerts}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apeilo-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_OLLAMA_URL: http://localhost:11434
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:
